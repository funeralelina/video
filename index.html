<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>In Ricordo</title>
<style>
  :root {
    --ink: #e8e6e1;
    --paper: #16181c;
    --line: #33363c;
    --gold: #c9a06a;
    --gold-dim: #7a6650;
    --soft: #9a9fa6;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Georgia', 'Iowan Old Style', 'Palatino Linotype', serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }

  .wrap {
    max-width: 560px;
    width: 100%;
  }

  .glow {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    margin: 0 auto 28px;
    box-shadow: 0 0 18px 6px rgba(201, 160, 106, 0.45);
  }

  h1 {
    font-weight: 400;
    font-size: clamp(2.1rem, 5.2vw, 3.1rem);
    letter-spacing: 0.02em;
    margin: 0 0 8px;
    color: var(--ink);
  }

  .subtitle {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 1.2rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--soft);
    margin: 0 0 40px;
  }

  /* Watch button */
  .watch-btn {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: inline-block;
    padding: 18px 40px;
    border: 1px solid var(--gold);
    border-radius: 2px;
    background: transparent;
    color: var(--gold);
    font-size: 1.35rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease;
  }

  .watch-btn:not(:disabled):hover {
    background: var(--gold);
    color: var(--paper);
  }

  .watch-btn:disabled {
    border-color: var(--line);
    color: var(--gold-dim);
    cursor: not-allowed;
  }

  .btn-note {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 1.05rem;
    color: var(--soft);
    margin: 14px 0 44px;
    line-height: 1.6;
  }

  .rule {
    width: 64px;
    height: 1px;
    background: var(--line);
    margin: 0 auto 44px;
  }

  .countdown {
    display: flex;
    justify-content: center;
    gap: clamp(16px, 5vw, 36px);
    margin-bottom: 40px;
  }

  .unit {
    min-width: 64px;
  }

  .unit .num {
    font-size: clamp(2.6rem, 9vw, 4.2rem);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: var(--ink);
  }

  .unit .label {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.92rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--soft);
    margin-top: 10px;
  }

  .when {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 1.15rem;
    color: var(--soft);
    line-height: 1.8;
  }

  .status {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 1.2rem;
    color: var(--gold);
    margin-top: 26px;
    line-height: 1.7;
    display: none;
  }

  @media (prefers-reduced-motion: no-preference) {
    .glow {
      animation: breathe 3.5s ease-in-out infinite;
    }
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.25); }
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="glow"></div>

    <h1>Diretta della Cerimonia</h1>
    <p class="subtitle">In Collegamento da Remoto</p>

    <button class="watch-btn" id="watchBtn" disabled>Guarda la Diretta</button>
    <p class="btn-note">
      Il link della diretta sarà disponibile Sabato 1 Agosto entro le ore 19:00
    </p>

    <div class="rule"></div>

    <div class="countdown" id="countdown">
      <div class="unit"><div class="num" id="days">00</div><div class="label">Giorni</div></div>
      <div class="unit"><div class="num" id="hours">00</div><div class="label">Ore</div></div>
      <div class="unit"><div class="num" id="minutes">00</div><div class="label">Minuti</div></div>
      <div class="unit"><div class="num" id="seconds">00</div><div class="label">Secondi</div></div>
    </div>

    <p class="status" id="status">
      Il link della diretta sarà disponibile a breve
    </p>
  </div>

<script>
  const REDIRECT_URL = "";

  const serviceStartDate = new Date("2026-08-01T17:00:00Z");

  const daysEl = document.getElementById("days");
  const hoursEl = document.getElementById("hours");
  const minutesEl = document.getElementById("minutes");
  const secondsEl = document.getElementById("seconds");
  const statusEl = document.getElementById("status");
  const countdownEl = document.getElementById("countdown");
  const watchBtn = document.getElementById("watchBtn");

  function pad(n) {
    return String(n).padStart(2, "0");
  }

  function tick() {
    try {
      const now = new Date();

      if (watchBtn) {
        if (REDIRECT_URL.trim() !== "") {
          if (watchBtn.disabled) watchBtn.disabled = false;
        } else if (!watchBtn.disabled) {
          watchBtn.disabled = true;
        }
      }

      const diff = serviceStartDate - now;

      if (diff <= 0) {
        if (countdownEl) countdownEl.style.display = "none";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      if (daysEl) daysEl.textContent = pad(days);
      if (hoursEl) hoursEl.textContent = pad(hours);
      if (minutesEl) minutesEl.textContent = pad(minutes);
      if (secondsEl) secondsEl.textContent = pad(seconds);
    } catch (err) {
      console.error("Countdown tick error:", err);
    }
  }

  tick();
  const timer = setInterval(tick, 1000);

  if (watchBtn) {
    watchBtn.addEventListener("click", () => {
      const url = REDIRECT_URL.trim();
      if (url !== "") {
        window.location.href = url;
      } else if (statusEl) {
        statusEl.style.display = "block";
      }
    });
  }

  const hourlyCheckStart = new Date("2026-07-30T04:00:00Z");
  const HOUR_MS = 60 * 60 * 1000;

  function beginHourlyChecks() {
    setInterval(() => {
      window.location.href = window.location.pathname + "?t=" + Date.now();
    }, HOUR_MS);
  }

  const msUntilHourlyStart = hourlyCheckStart - new Date();
  if (msUntilHourlyStart <= 0) {
    beginHourlyChecks();
  } else {
    setTimeout(beginHourlyChecks, msUntilHourlyStart);
  }
</script>

</body>
</html>
